# =====================================================================
#  Mango + Noctalia v5 — ~/.config/mango/config.conf
#  Noctalia snippets follow
#  https://docs.noctalia.dev/noctalia/compositor-settings/mango/
#  Option names are Mango 0.18+ (snake_case). The installer rewrites
#  them to the old names when it finds an older Mango.
#
#  Mirrors this repo's niri config: scroller (niri-style) layout, 12px
#  gaps, 20px corners, Rosé Pine border, soft shadow, blur on every
#  window and on Noctalia's bar/panels/notifications, the Noctalia
#  settings window opening full size, and niri's key scheme.
# =====================================================================

# ---------------------------------------------------------------------
# Environment and autostart
# ---------------------------------------------------------------------
env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
exec_once=noctalia

# ---------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------
xkb_rules_layout=us
repeat_rate=40
repeat_delay=300
numlock_on=1

tap_to_click=1
trackpad_natural_scrolling=1
mouse_accel_profile=1

sloppy_focus=1
warp_cursor=1

# ---------------------------------------------------------------------
# Layout: scrolling columns like niri
# ---------------------------------------------------------------------
scroller_default_proportion=0.5
scroller_proportion_preset=0.33333,0.5,0.66667
scroller_focus_center=0
scroller_prefer_center=0
scroller_default_proportion_single=1.0

tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# ---------------------------------------------------------------------
# Look: gaps, border, corners (same as niri)
# ---------------------------------------------------------------------
gap_inner_horizontal=12
gap_inner_vertical=12
gap_outer_horizontal=12
gap_outer_vertical=12
border_px=2
border_radius=20
focus_color=0xc4a7e7ff
border_color=0x26233aff
maximized_screen_color=0xc4a7e7ff
root_color=0x191724ff

# ---------------------------------------------------------------------
# Noctalia animates its own surfaces
# ---------------------------------------------------------------------
layer_animations=0

# ---------------------------------------------------------------------
# Blur: every window, plus Noctalia's bar, panels and notifications
# ---------------------------------------------------------------------
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.5

# Wallpaper and backdrop are opaque: blurring them only costs GPU time.
layer_rule=no_blur:1,layer_name:^noctalia-(wallpaper|backdrop)
# Screenshot region picker: no blur or animation (keeps captures clean).
layer_rule=no_blur:1,no_animation:1,layer_name:selection

# ---------------------------------------------------------------------
# Shadows
# ---------------------------------------------------------------------
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=5
shadows_blur=30
shadows_position_x=0
shadows_position_y=5
shadows_color=0x00000077

# ---------------------------------------------------------------------
# Window rules
# ---------------------------------------------------------------------
# Noctalia settings: open full size (not fullscreen), centred, so the
# bar stays visible and the window keeps its blur.
window_rule=is_floating:1,width:0.94,height:0.9,app_id:^dev\.noctalia\.Noctalia$

# Small utility windows float, as in the niri config.
window_rule=is_floating:1,title:^Picture-in-Picture$
window_rule=is_floating:1,app_id:^org\.gnome\.Calculator$
window_rule=is_floating:1,app_id:^(org\.pulseaudio\.)?pavucontrol$
window_rule=is_floating:1,app_id:^nm-connection-editor$

# ---------------------------------------------------------------------
# Keybinds (same layout as the niri config)
# ---------------------------------------------------------------------
# Noctalia
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,d,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER+SHIFT,comma,spawn,noctalia msg settings-toggle
bind=ALT,Tab,spawn,noctalia msg window-switcher hold
bind=ALT+SHIFT,Tab,spawn,noctalia msg window-switcher hold reverse

# Media keys (Noctalia shows its OSD); work on the lock screen too
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

# Apps
bind=SUPER,Return,spawn,alacritty
bind=SUPER,e,spawn,nautilus
bind=SUPER,b,spawn,firefox

# Windows
bind=SUPER,q,killclient,
bind=SUPER,o,toggleoverview,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER,v,togglefloating,
bind=SUPER,c,centerwin,
bind=SUPER,r,switch_proportion_preset,
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right
bind=SUPER,minus,resizewin,-80,+0
bind=SUPER,equal,resizewin,+80,+0
bind=SUPER+SHIFT,minus,resizewin,+0,-80
bind=SUPER+SHIFT,equal,resizewin,+0,+80

# Focus: arrows / HJKL
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# Move: Mod+Ctrl + direction
bind=SUPER+CTRL,Left,move_client,left
bind=SUPER+CTRL,Right,move_client,right
bind=SUPER+CTRL,Up,move_client,up
bind=SUPER+CTRL,Down,move_client,down
bind=SUPER+CTRL,h,move_client,left
bind=SUPER+CTRL,l,move_client,right
bind=SUPER+CTRL,k,move_client,up
bind=SUPER+CTRL,j,move_client,down

# Monitors
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right

# Tags (workspaces): next/previous with Page_Down/Page_Up or U/I
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,u,viewtoright,0
bind=SUPER,i,viewtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER+CTRL,u,tagtoright,0
bind=SUPER+CTRL,i,tagtoleft,0
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# Mouse: move / resize, three-finger swipe between tags
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
gesturebind=none,left,3,viewtoright_have_client
gesturebind=none,right,3,viewtoleft_have_client

# Screenshots (Noctalia)
bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=CTRL,Print,spawn,noctalia msg screenshot-fullscreen
bind=ALT,Print,spawn,noctalia msg screenshot-annotate

# Session
bind=SUPER+SHIFT,p,spawn,noctalia msg dpms-off
bind=SUPER+SHIFT,r,reload_config,
bind=SUPER+SHIFT,e,quit,
bind=CTRL+ALT,Delete,quit,
